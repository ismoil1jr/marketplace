<!doctype html>
<html lang="uz">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="robots" content="noindex">
	<title>Sahifa topilmadi — magazinlar.uz</title>
	<style>
		*, *::before, *::after { box-sizing: border-box; }
		body {
			margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
			background: #F2F1EE; color: #16140F;
			font: 16px/1.5 "Onest", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
			-webkit-font-smoothing: antialiased;
		}
		.box { width: 100%; max-width: 440px; text-align: center; }
		.mark { width: 72px; height: 72px; margin: 0 auto 20px; display: grid; place-items: center; border-radius: 24px; background: #fff; color: #E8611A; box-shadow: 0 8px 30px rgb(0 0 0 / .06); }
		.mark svg { width: 34px; height: 34px; }
		.code { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: .08em; color: #8A867E; }
		h1 { margin: 6px 0 10px; font-size: 26px; line-height: 1.2; letter-spacing: -.01em; }
		p { margin: 0 0 24px; color: #5F5B53; }
		.btns { display: grid; gap: 10px; }
		.btn {
			display: grid; place-items: center; height: 50px; padding: 0 20px; border: 0; border-radius: 14px;
			font: inherit; font-weight: 600; font-size: 15px; text-decoration: none; cursor: pointer;
		}
		.btn--brand { background: #E8611A; color: #fff; }
		.btn--plain { background: #fff; color: #16140F; }
		@media (min-width: 480px) { .btns { grid-template-columns: 1fr 1fr; } }
	</style>
	<script>window.is_404 = true;</script>
</head>
<body>
	<main class="box">
		<div class="mark" aria-hidden="true">
			<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
				<path d="M4 7h16l-1.5 11a2 2 0 0 1-2 1.7h-9a2 2 0 0 1-2-1.7L4 7z"/><path d="M8 7V5a4 4 0 0 1 8 0v2"/><path d="M9.5 12.5l5 5m0-5l-5 5"/>
			</svg>
		</div>
		<p class="code">404</p>
		<h1>Sahifa topilmadi</h1>
		<p>Bu manzil noto‘g‘ri yoki sahifa olib tashlangan. Tovar sotuvdan chiqarilgan bo‘lishi ham mumkin.</p>
		<div class="btns">
			<a class="btn btn--brand" href="/">Bosh sahifaga qaytish</a>
			<button type="button" class="btn btn--plain" onclick="history.length > 1 ? history.back() : (location.href = '/')">Orqaga</button>
		</div>
	</main>
</body>
</html>
