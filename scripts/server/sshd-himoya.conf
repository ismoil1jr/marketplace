# /etc/ssh/sshd_config.d/10-himoya.conf — SSH faqat kalit bilan (parol bilan kirib bo'lmaydi).
# Ubuntu bu papkadagi fayllarni nom tartibida o'qiydi va birinchi qiymat yutadi: 10-... fayli
# cloud-init'ning 50-cloud-init.conf (PasswordAuthentication yes) faylidan oldin o'qiladi.
#
# YOQISHDAN OLDIN: serverga kiradigan har bir kompyuterda SSH kaliti ishlashini tekshiring
# (ssh -o PasswordAuthentication=no root@161.97.176.253). Joriy sessiyani yopmang, yangi oynada sinang.
# Kirib bo'lmay qolsa: Contabo paneli -> VPS -> VNC konsol (u SSH emas, parol bilan ishlaydi).
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin prohibit-password
MaxAuthTries 3
LoginGraceTime 30
