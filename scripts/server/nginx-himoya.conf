# magazinlar.uz — nginx darajasidagi himoya: HAR BIR IP alohida hisoblanadi.
# Fayl /etc/nginx/conf.d/10-himoya.conf ga ko'chiriladi (http {} ichida o'qiladi), bench tomonidan
# yaratiladigan frappe-bench.conf ga tegilmaydi — `bench setup nginx` qayta ishlasa ham limitlar qoladi.
#
# Mantiq: limit_req har IP uchun alohida hisoblagich yuritadi. Bitta IP limitdan oshsa — faqat o'sha IP
# 429 oladi, boshqalar bemalol ishlaydi. Butun sayt bo'yicha umumiy limit YO'Q (u bo'lsa bitta hujumchi
# hammani 429 ga tiqib qo'yardi). Limitdan oshgan so'rov error.log ga "limiting requests ... by zone"
# yozadi — fail2ban shu yozuv bo'yicha o'sha bitta IP'ni vaqtincha bloklaydi.
#
# Raqamlar nega keng: O'zbekistondagi mobil operatorlar ko'p abonentni bitta IP ostiga chiqaradi (CGNAT).
# Bitta IP = yuzlab odam bo'lishi mumkin, shuning uchun limit "bitta odam" emas, "bitta uy/ofis/operator" hisobida.

# Ishonchli IP'lar — ularga limit umuman qo'yilmaydi. Ofis shu yerda bo'lgani uchun ofisdan yuklama testi
# (ab) qilsangiz ham o'zingizni bloklab qo'ymaysiz; server o'ziga so'rov yuborganda (PDF chek rasmi, CSS) ham
# 429 chiqmaydi. Ofis IP'si o'zgarsa — shu ro'yxatni yangilang (hozirgi IP: curl -s https://api.ipify.org).
geo $mp_ishonchli {
	default         0;
	127.0.0.1       1;
	::1             1;
	161.97.176.253  1;  # server o'zi
	144.124.199.185 1;  # ofis
}

# Limit kaliti = IP. Ishonchli IP bo'lsa bo'sh (limit yo'q). /assets/ (CSS, JS) va /files/ (tovar rasmlari)
# ham bo'sh — ularni nginx diskdan arzon beradi, bitta katalog sahifasi 30-50 ta shunday so'rov yuboradi.
# Ajratuvchi ":" — "1:/..." ishonchli, "0:/assets/..." statik, qolgani "0:/sahifa" -> IP bo'yicha hisoblanadi.
map "$mp_ishonchli:$request_uri" $mp_sahifa_ip {
	~^1:         "";
	~^0:/assets/ "";
	~^0:/files/  "";
	default      $binary_remote_addr;
}

# API chaqiruvlari (Frappe'ning hamma /api/ yo'llari + kirish): sahifalardan qattiqroq limit.
map "$mp_ishonchli:$request_uri" $mp_api_ip {
	~^1:       "";
	~^0:/api/  $binary_remote_addr;
	~^0:/login $binary_remote_addr;
	default    "";
}

# Ulanish soni ham ishonchli IP'da sanalmasin.
map $mp_ishonchli $mp_ulanish_ip {
	1       "";
	default $binary_remote_addr;
}

# Zona = Redis emas, nginx xotirasi. 20 MB ≈ 320 000 ta IP.
limit_req_zone  $mp_sahifa_ip   zone=mp_sahifa:20m   rate=20r/s;
limit_req_zone  $mp_api_ip      zone=mp_api:10m      rate=10r/s;
limit_conn_zone $mp_ulanish_ip  zone=mp_ulanish:10m;

# burst — qisqa portlashga ruxsat (sahifa ochilganda bir nechta so'rov birga ketadi), nodelay — kutdirmasdan o'tkazadi.
# Bitta IP: sahifa 20/s (portlash 60), API 10/s (portlash 40), bir vaqtda 50 ta ochiq ulanish.
limit_req  zone=mp_sahifa burst=60 nodelay;
limit_req  zone=mp_api    burst=40 nodelay;
limit_conn mp_ulanish 50;

limit_req_status  429;
limit_conn_status 429;
limit_req_log_level  error;
limit_conn_log_level error;

# Sekin ulanib turib serverni band qiladigan hujum (slowloris): sarlavha/tanani 10 soniyada yubormasa — uziladi.
client_header_timeout 10s;
client_body_timeout   10s;
send_timeout          30s;
