# magazinlar.uz — nginx darajasidagi himoya: bitta IP'dan keladigan so'rov va ulanishlar soniga limit.
# Fayl /etc/nginx/conf.d/10-himoya.conf ga ko'chiriladi (http {} ichida o'qiladi), bench tomonidan
# yaratiladigan frappe-bench.conf ga tegilmaydi — `bench setup nginx` qayta ishlasa ham limitlar qoladi.
#
# Mantiq: limit_req/limit_conn http darajasida yozilgan, server va location bloklari uni meros qilib oladi
# (ularning ichida o'z limit_req'i bo'lmasa). Limitdan oshgan so'rovga 429 qaytadi va error.log ga
# "limiting requests ... by zone" yoziladi — fail2ban shu yozuv bo'yicha IP'ni vaqtincha bloklaydi.
#
# Raqamlar nega keng: O'zbekistondagi mobil operatorlar ko'p abonentni bitta IP ostiga chiqaradi (CGNAT).
# Bitta IP = yuzlab odam bo'lishi mumkin, shuning uchun limit "bitta odam" emas, "bitta uy/ofis/operator" hisobida.

# Kalit: /assets/ (CSS, JS) va /files/ (tovar rasmlari) sanalmaydi — ularni nginx o'zi diskdan beradi, arzon,
# va bitta katalog sahifasi 30-50 ta shunday so'rov yuboradi. Bo'sh kalit = limit qo'llanmaydi.
map $request_uri $mp_sahifa_ip {
	~^/assets/  "";
	~^/files/   "";
	default     $binary_remote_addr;
}

# API chaqiruvlari (Frappe'ning hamma /api/ yo'llari + kirish): sahifalardan qattiqroq limit.
map $request_uri $mp_api_ip {
	~^/api/     $binary_remote_addr;
	~^/login    $binary_remote_addr;
	default     "";
}

# Zona = Redis emas, nginx xotirasi. 20 MB ≈ 320 000 ta IP.
limit_req_zone  $mp_sahifa_ip  zone=mp_sahifa:20m  rate=20r/s;
limit_req_zone  $mp_api_ip     zone=mp_api:10m     rate=10r/s;
limit_conn_zone $binary_remote_addr zone=mp_ulanish:10m;

# burst — qisqa portlashga ruxsat (sahifa ochilganda bir nechta so'rov birga ketadi), nodelay — kutdirmasdan o'tkazadi.
limit_req  zone=mp_sahifa burst=60 nodelay;
limit_req  zone=mp_api    burst=40 nodelay;
limit_conn mp_ulanish 50;

limit_req_status  429;
limit_conn_status 429;
limit_req_log_level  error;
limit_conn_log_level error;

# Sekin ulanib turib serverni band qiladigan hujum (slowloris): sarlavha/tanani 10 soniyada yubormasa — uziladi.
client_header_timeout 10s;
client_body_timeout   10s;
send_timeout          30s;
