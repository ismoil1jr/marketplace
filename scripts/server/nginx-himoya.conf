# magazinlar.uz — nginx darajasidagi himoya: HAR BIR IP alohida hisoblanadi.
# Fayl /etc/nginx/conf.d/10-himoya.conf ga ko'chiriladi (http {} ichida o'qiladi), bench tomonidan
# yaratiladigan frappe-bench.conf ga tegilmaydi — `bench setup nginx` qayta ishlasa ham limitlar qoladi.
#
# Mantiq: limit_req har IP uchun alohida hisoblagich yuritadi. Bitta IP limitdan oshsa — faqat o'sha IP
# 429 oladi, boshqalar bemalol ishlaydi. Butun sayt bo'yicha umumiy limit YO'Q. Limitdan oshgan so'rov
# error.log ga "limiting requests ... by zone" yozadi — fail2ban shu bo'yicha o'sha bitta IP'ni bloklaydi.
#
# Raqamlar nega keng: O'zbekistondagi mobil operatorlar ko'p abonentni bitta IP ostiga chiqaradi (CGNAT).
# Bitta IP = yuzlab odam bo'lishi mumkin, shuning uchun limit "bitta odam" emas, "bitta uy/ofis/operator" hisobida.

# 1-qadam: IP limitga tushadimi? geo FAQAT oddiy qiymat qaytaradi (0/1) — bu yerga o'zgaruvchi (masalan
# $binary_remote_addr) YOZIB BO'LMAYDI, geo uni tushunmaydi. Ishonchli IP = 0 (limitdan ozod), qolgani = 1.
# Ofis shu yerda: shu yerdan ab testi qilinsa ham o'zini bloklamaydi. Server o'zi ham: PDF chek rasmi/CSS'ni
# o'ziga so'raydi. Ofis IP'si o'zgarsa yangilang (hozirgi IP: curl -s https://api.ipify.org).
geo $mp_limitli {
	default         1;
	127.0.0.1       0;
	::1             0;
	161.97.176.253  0;  # server o'zi
	144.124.199.185 0;  # ofis
}

# 2-qadam: limit kaliti. map natijasi o'zgaruvchi BO'LISHI MUMKIN (geo'dan farqli). Ozod bo'lsa bo'sh kalit
# (bo'sh kalit limitga umuman kirmaydi), aks holda mijoz IP'si — har IP alohida hisoblanadi.
map $mp_limitli $mp_ip_kalit {
	0       "";
	default $binary_remote_addr;
}

# 3-qadam: statik fayllar (CSS, JS, tovar rasmlari) hech kimda sanalmasin — nginx ularni diskdan arzon beradi,
# bitta katalog sahifasi 30-50 ta shunday so'rov yuboradi. Qolgan sahifalar uchun kalit = yuqoridagi IP kaliti.
map $uri $mp_sahifa_ip {
	~^/assets/ "";
	~^/files/  "";
	default    $mp_ip_kalit;
}

# API chaqiruvlari (Frappe'ning /api/ yo'llari + kirish): faqat shular, qolgani bo'sh. Ozod IP'da kalit
# allaqachon bo'sh, shuning uchun API ham limitlanmaydi.
map $uri $mp_api_ip {
	~^/api/  $mp_ip_kalit;
	~^/login $mp_ip_kalit;
	default  "";
}

# Zona = Redis emas, nginx xotirasi. 20 MB ≈ 320 000 ta IP.
limit_req_zone  $mp_sahifa_ip  zone=mp_sahifa:20m  rate=20r/s;
limit_req_zone  $mp_api_ip     zone=mp_api:10m     rate=10r/s;
limit_conn_zone $mp_ip_kalit   zone=mp_ulanish:10m;

# burst — qisqa portlashga ruxsat (sahifa ochilganda bir nechta so'rov birga ketadi), nodelay — kutdirmasdan o'tkazadi.
# Bitta IP: sahifa 20/s (portlash 60), API 10/s (portlash 40), bir vaqtda 50 ta ochiq ulanish.
limit_req  zone=mp_sahifa burst=60 nodelay;
limit_req  zone=mp_api    burst=40 nodelay;
limit_conn mp_ulanish 50;

limit_req_status  429;
limit_conn_status 429;
limit_req_log_level  error;
limit_conn_log_level error;

# Sekin ulanib turib serverni band qiladigan hujum (slowloris): sarlavha/tanani 10 soniyada yubormasa — uziladi.
client_header_timeout 10s;
client_body_timeout   10s;
send_timeout          30s;
