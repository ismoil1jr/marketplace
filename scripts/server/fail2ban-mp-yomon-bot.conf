# /etc/fail2ban/filter.d/mp-yomon-bot.conf — saytga zararli botlar (WAF o'rnida, nginx access.log bo'yicha).
#
# Ikki belgi:
#  1) zaif joy qidirish: bizda umuman yo'q yo'llar — PHP, WordPress, .env, .git, phpMyAdmin, cgi-bin,
#     yo'l bo'ylab yuqoriga chiqish (../), /etc/passwd. Oddiy mijoz bunday so'rov yubormaydi.
#  2) hujum vositalari User-Agent bo'yicha: sqlmap, nikto, nuclei, masscan va h.k.
#
# Ataylab YO'Q: curl, python-requests, Go-http-client, okhttp, Java — Click, Payme, Telegram, Meta va
# Google Apps Script serverlari shunga o'xshash kutubxonalar bilan so'rov yuborishi mumkin, ularni bloklasak
# to'lovlar va lidlar to'xtaydi.
#
# Log formati (00-log-format.conf, "main"):
#   IP - user [vaqt] "METHOD yo'l HTTP/x" status bayt "referer" "user-agent" "x-forwarded-for"
# Sinash: fail2ban-regex /var/log/nginx/access.log /etc/fail2ban/filter.d/mp-yomon-bot.conf

[Definition]

paths = \.php\b|/wp-(?:admin|login|content|includes|json)|/xmlrpc|/\.env|/\.git/|/\.aws|/\.ssh|/\.DS_Store|/phpmyadmin|/pma/|/myadmin|/cgi-bin/|/vendor/phpunit|/boaform|/HNAP1|/actuator|/solr/|/owa/|/autodiscover|/etc/passwd|/\.\./|%%2e%%2e|/config\.json|/server-status

agents = sqlmap|nikto|nmap|masscan|zgrab|nuclei|wpscan|dirbuster|gobuster|ffuf|feroxbuster|acunetix|netsparker|jorgee|pathscan|l9explore|l9tcpid|Hello, world|fuzz faster|WinHttp\.WinHttpRequest

failregex = ^<HOST> \S+ \S+ \[[^\]]*\] "[A-Z]+ [^"]*(?:%(paths)s)[^"]*" \d{3}
            ^<HOST> \S+ \S+ \[[^\]]*\] "[^"]*" \d{3} \S+ "[^"]*" "[^"]*(?i:%(agents)s)[^"]*"

ignoreregex =
